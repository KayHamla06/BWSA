<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Your Usage</h1>
    <div id="usage"></div>
  </div>
  <script>
    const apiKey = prompt('Enter your API key');
    fetch('/api/dashboard/usage', { headers: {'x-api-key': apiKey} })
      .then(r => r.json())
      .then(data => document.getElementById('usage').innerHTML = JSON.stringify(data, null, 2));
  </script>
</body>
</html>
