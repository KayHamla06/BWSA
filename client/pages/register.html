<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Ubuntu Market</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/pricing.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/animations.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card pop-in">
      <div class="auth-logo">
        <img src="/assets/logo.png" alt="Ubuntu market logo" class="auth-logo-img">
        <p>Start accepting payments in minutes</p>
      </div>

      <div class="auth-tabs">
        <a href="/login" class="auth-tab">Sign In</a>
        <a href="/register" class="auth-tab active">Sign Up</a>
      </div>

      <form id="registerForm" class="auth-form">
        <!-- Plan Selection -->
        <div class="form-group">
          <label style="font-weight:700;margin-bottom:10px;display:block;">Choose Your Plan <a href="/pricing" target="_blank" style="font-size:12px;color:var(--primary-dark);font-weight:500;margin-left:6px;">Compare plans &rarr;</a></label>
          <div class="plan-select-grid" id="planSelectGrid">
            <label class="plan-select-card" for="plan-payg">
              <input type="radio" id="plan-payg" name="plan" value="payg">
              <div class="plan-select-name">Pay-per-Use</div>
              <div class="plan-select-price">Free</div>
              <div class="plan-select-trial">14-day free trial</div>
            </label>
            <label class="plan-select-card" for="plan-starter">
              <input type="radio" id="plan-starter" name="plan" value="starter" checked>
              <div class="plan-select-name">Starter</div>
              <div class="plan-select-price">R79/mo</div>
              <div class="plan-select-trial">14-day free trial</div>
            </label>
            <label class="plan-select-card" for="plan-business">
              <input type="radio" id="plan-business" name="plan" value="business">
              <div class="plan-select-name">Business</div>
              <div class="plan-select-price">R249/mo</div>
              <div class="plan-select-trial">14-day free trial</div>
            </label>
            <label class="plan-select-card" for="plan-pro">
              <input type="radio" id="plan-pro" name="plan" value="pro">
              <div class="plan-select-name">Pro</div>
              <div class="plan-select-price">R699/mo</div>
              <div class="plan-select-trial">14-day free trial</div>
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="businessName">Business Name</label>
          <input type="text" id="businessName" name="businessName" placeholder="Your Business" required>
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="phone">WhatsApp Number</label>
          <input type="tel" id="phone" name="phone" placeholder="+27 123 456 7890" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Min 8 characters" required minlength="8">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" required minlength="8">
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="registerBtn">Create Account</button>
      </form>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
