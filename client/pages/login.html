<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Ubuntu Market</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/animations.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card pop-in">
      <div class="auth-logo">
        <img src="/assets/logo.png" alt="Ubuntu market logo" class="auth-logo-img">
        <p>Accept payments on WhatsApp</p>
        <a href="/" style="font-size:12px;color:var(--primary-dark);margin-top:4px;display:inline-block;">View plans &amp; pricing &rarr;</a>
      </div>

      <div class="auth-tabs">
        <a href="/login" class="auth-tab active">Sign In</a>
        <a href="/register" class="auth-tab">Sign Up</a>
      </div>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="loginBtn">Sign In</button>
      </form>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        const data = await api.post('/api/auth/login', {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        });
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        showToast('Signed in successfully!', 'success');

        // Redirect unverified users to verification page
        if (data.user && data.user.isVerified === false) {
          setTimeout(() => { window.location.href = '/verify'; }, 1200);
        } else {
          setTimeout(() => { window.location.href = '/dashboard'; }, 800);
        }
      } catch (err) {
        showToast(err.message || 'Invalid email or password. Please try again.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
