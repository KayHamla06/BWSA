<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Ubuntu Market</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/products.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/animations.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main navigation">
      <div class="sidebar-header">
        <img src="/assets/logo.png" alt="Ubuntu market logo" class="sidebar-logo">
        <button class="sidebar-close" id="sidebarClose" aria-label="Close sidebar">&times;</button>
      </div>
      <nav class="sidebar-nav">
        <a href="/dashboard" class="nav-item" data-page="dashboard">
          <span class="nav-icon"><i data-lucide="layout-dashboard"></i></span> Dashboard
        </a>
        <a href="/products" class="nav-item active" data-page="products">
          <span class="nav-icon"><i data-lucide="package"></i></span> Products
        </a>
        <a href="/orders" class="nav-item" data-page="orders" data-feature="order_tracking">
          <span class="nav-icon"><i data-lucide="shopping-cart"></i></span> Orders
        </a>
        <a href="/payments" class="nav-item" data-page="payments">
          <span class="nav-icon"><i data-lucide="credit-card"></i></span> Payments
        </a>
        <a href="/customers" class="nav-item" data-page="customers">
          <span class="nav-icon"><i data-lucide="users"></i></span> Customers
        </a>
        <a href="/settings" class="nav-item" data-page="settings">
          <span class="nav-icon"><i data-lucide="settings"></i></span> Settings
        </a>
      </nav>
      <div class="sidebar-footer">
        <button class="btn btn-outline btn-full" id="logoutBtn">Logout</button>
        <div class="powered-by-bubble">
          <span>Powered by Bubble</span>
          <img src="/assets/Bubble_Logo.png" alt="Bubble" class="bubble-logo">
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <button class="hamburger" id="hamburgerBtn" aria-label="Open menu"><i data-lucide="menu"></i></button>
        <h1 class="page-title">Products</h1>
        <button class="btn btn-primary" id="addProductBtn">+ Add Product</button>
      </header>

      <div class="content-area">
        <!-- Product Grid -->
        <div class="product-grid" id="productGrid">
          <div class="text-center">Loading products...</div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Product Modal -->
  <div class="modal-overlay" id="productModal" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Add Product</h2>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <form id="productForm" enctype="multipart/form-data">
        <input type="hidden" id="productId" name="productId">
        <div class="form-group">
          <label for="productName">Product Name</label>
          <input type="text" id="productName" name="name" placeholder="e.g. Nike Air Max" required>
        </div>
        <div class="form-group">
          <label for="productDesc">Description</label>
          <textarea id="productDesc" name="description" rows="3" placeholder="Product description..."></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="productPrice">Price (ZAR)</label>
            <input type="number" id="productPrice" name="price" step="0.01" min="0" placeholder="0.00" required>
          </div>
          <div class="form-group">
            <label for="productStock">Stock</label>
            <input type="number" id="productStock" name="stock" min="0" value="0">
          </div>
        </div>
        <div class="form-group">
          <label for="productCategory">Category</label>
          <input type="text" id="productCategory" name="category" placeholder="e.g. Footwear">
        </div>
        <div class="form-group">
          <label for="productImage">Product Image</label>
          <input type="file" id="productImage" name="image" accept="image/*">
          <div class="image-preview" id="imagePreview"></div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-outline" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveProductBtn">Save Product</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/products.js"></script>
</body>
</html>
