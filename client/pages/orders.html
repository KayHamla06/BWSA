<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders - Ubuntu Market</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/orders.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/animations.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <img src="/assets/logo.png" alt="Ubuntu market logo" class="sidebar-logo">
        <button class="sidebar-close" id="sidebarClose">&times;</button>
      </div>
      <nav class="sidebar-nav">
        <a href="/dashboard" class="nav-item"><span class="nav-icon"><i data-lucide="layout-dashboard"></i></span> Dashboard</a>
        <a href="/products" class="nav-item"><span class="nav-icon"><i data-lucide="package"></i></span> Products</a>
        <a href="/orders" class="nav-item active"><span class="nav-icon"><i data-lucide="shopping-cart"></i></span> Orders</a>
        <a href="/payments" class="nav-item"><span class="nav-icon"><i data-lucide="credit-card"></i></span> Payments</a>
        <a href="/customers" class="nav-item"><span class="nav-icon"><i data-lucide="users"></i></span> Customers</a>
        <a href="/settings" class="nav-item"><span class="nav-icon"><i data-lucide="settings"></i></span> Settings</a>
      </nav>
      <div class="sidebar-footer">
        <button class="btn btn-outline btn-full" id="logoutBtn">Logout</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button class="hamburger" id="hamburgerBtn"><i data-lucide="menu"></i></button>
        <h1 class="page-title">Orders</h1>
        <div class="topbar-filters">
          <select id="statusFilter" class="select-input" title="Filter orders by status">
            <option value="">All Orders</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="declined">Declined</option>
            <option value="delivered">Delivered</option>
          </select>
        </div>
      </header>

      <div class="content-area">
        <div class="card">
          <div class="table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Order ID</th>
                  <th>Customer Phone</th>
                  <th>Product Name</th>
                  <th>Price</th>
                  <th>Payment Status</th>
                  <th>Date</th>
                </tr>
              </thead>
              <tbody id="ordersBody">
                <tr><td colspan="6" class="text-center">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/orders.js"></script>
</body>
</html>
